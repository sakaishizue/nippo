name: Deploy staging

# main の CI が成功したら、イメージを作ってステージングにデプロイする
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-southeast1
  IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/nippo/app:${{ github.event.workflow_run.head_sha }}
  # バックアップのジョブのイメージ(backup/Dockerfile)。本番(release.yml)も同じイメージを使う
  BACKUP_IMAGE: asia-southeast1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/nippo/backup:${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    name: Build and deploy to staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          docker build -t "$BACKUP_IMAGE" backup
          docker push "$BACKUP_IMAGE"
      # マイグレーションは、イメージを作れた後、新しいバージョンを動かす前に適用する(CI/CD 設定手順書 5章)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: |
          # 直接接続の接続文字列(接続プール用ではマイグレーションの排他ができない)。ログに出さず、ファイルにも書かない
          DIRECT_URL="$(gcloud secrets versions access latest --secret=nippo-staging-database-direct-url)"
          echo "::add-mask::$DIRECT_URL"
          DIRECT_URL="$DIRECT_URL" pnpm --filter @nippo/api db:migrate:deploy
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: nippo-staging
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }} --allow-unauthenticated
          secrets: |
            DATABASE_URL=nippo-staging-database-url:latest
      # 未提出のリマインドのジョブ(要件定義書 F-54、CI/CD 設定手順書 2.8)。アプリと同じイメージで dist/reminder.js を実行する。
      # ステージングは定期実行せず、確認するときに手動で実行する
      - name: Deploy the reminder job
        run: |
          gcloud run jobs deploy nippo-reminder-staging --region "$REGION" --image "$IMAGE" \
            --command node --args=--enable-source-maps,dist/reminder.js \
            --service-account "${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-secrets DATABASE_URL=nippo-staging-database-url:latest \
            --tasks 1 --max-retries 1 --task-timeout 10m --quiet
      # バックアップのジョブ(CI/CD 設定手順書 2.7)。ステージングは定期実行せず、確認するときに手動で実行する
      - name: Deploy the backup job
        run: |
          gcloud run jobs deploy nippo-backup-staging --region "$REGION" --image "$BACKUP_IMAGE" \
            --service-account "nippo-backup-staging@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets DATABASE_URL=nippo-staging-database-direct-url:latest \
            --set-env-vars BUCKET=${{ vars.GCP_PROJECT_ID }}-staging-backup \
            --tasks 1 --max-retries 1 --task-timeout 30m --memory 1Gi --quiet
