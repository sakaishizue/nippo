name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # データベースを使うAPIテスト(*.db.test.ts)用の PostgreSQL
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nippo
          POSTGRES_PASSWORD: nippo
          POSTGRES_DB: nippo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nippo -d nippo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://nippo:nippo@localhost:5432/nippo_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:coverage

  db:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIRECT_URL: postgres://nippo:nippo@localhost:5432/nippo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # ローカル開発用の docker-compose.yml がそのまま動くことも、ここで確認する
      - run: docker compose up -d --wait
      - run: pnpm --filter @nippo/api db:migrate:deploy
      # マイグレーションを適用した結果が schema.prisma と一致するか(マイグレーションの作り忘れがないか)
      - run: pnpm --filter @nippo/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit msedge
      - run: pnpm test:e2e --pass-with-no-tests
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
