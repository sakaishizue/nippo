name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # データベースを使うAPIテスト(*.db.test.ts)用の PostgreSQL
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nippo
          POSTGRES_PASSWORD: nippo
          POSTGRES_DB: nippo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nippo -d nippo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://nippo:nippo@localhost:5432/nippo_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm -r --if-present build
      # 本番用にまとめた API が起動できること(テストは TypeScript のソースで動くため、まとめたときの問題はここでしか分からない)
      - name: Smoke test the API bundle
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" NODE_ENV=production PORT=8080 node apps/api/dist/server.js &
          curl -fsS --retry-connrefused --retry 20 --retry-delay 1 http://localhost:8080/api/v1/health
      # 本番用にまとめたリマインドの定期処理(Cloud Run ジョブ)が、最後まで実行できること
      - name: Smoke test the reminder job bundle
        run: DATABASE_URL="$TEST_DATABASE_URL" NODE_ENV=production node apps/api/dist/reminder.js

  db:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DIRECT_URL: postgres://nippo:nippo@localhost:5432/nippo
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # ローカル開発用の docker-compose.yml がそのまま動くことも、ここで確認する
      - run: docker compose up -d --wait
      - run: pnpm --filter @nippo/api db:migrate:deploy
      # マイグレーションを適用した結果が schema.prisma と一致するか(マイグレーションの作り忘れがないか)
      - run: pnpm --filter @nippo/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 画面テストで起動する API が使う PostgreSQL
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nippo
          POSTGRES_PASSWORD: nippo
          POSTGRES_DB: nippo_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nippo -d nippo_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://nippo:nippo@localhost:5432/nippo_e2e
      DIRECT_URL: postgres://nippo:nippo@localhost:5432/nippo_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit msedge
      - run: pnpm --filter @nippo/api db:migrate:deploy
      # テスト仕様書 3章のデータを入れる
      - run: pnpm --filter @nippo/api db:seed
      # Playwright が API と画面の開発サーバーを起動してから、画面テストを実行する
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # ステージングへのデプロイ(deploy.yml)と同じ Dockerfile でイメージを作る
      - name: Build the image
        run: docker build -t nippo:ci .
      # 作ったイメージが起動し、画面と API を配信できること。データベースを使わない URL だけを確かめる
      - name: Smoke test the image
        run: |
          docker run -d --name nippo -p 8080:8080 -e DATABASE_URL=postgres://nobody:nobody@localhost:5432/none nippo:ci
          # 起動するまでは、Docker の転送が接続を受けてすぐ切るため(connection reset)、どのエラーでも再試行する
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors http://localhost:8080/api/v1/health
          # 画面と、画面側のルーティングの URL で index.html を返す
          curl -fsS http://localhost:8080/ | grep -q '<div id="root"></div>'
          curl -fsS http://localhost:8080/reports/1 | grep -q '<div id="root"></div>'
          # ハッシュ付きのファイルは長く保存してよい
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI "http://localhost:8080${asset}" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          # API の URL には画面を返さない
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/no-such-api)" = "401"
          # root 以外のユーザーで動いている
          test "$(docker exec nippo id -u)" != "0"
      - name: Show the container logs
        if: failure()
        run: docker logs nippo || true

  backup:
    name: Backup image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 書き出すデータベース。Neon より古い版でも書き出せることを兼ねて、他のジョブと同じ版にする
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nippo
          POSTGRES_PASSWORD: nippo
          POSTGRES_DB: nippo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nippo -d nippo"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DB: postgres://nippo:nippo@localhost:5432
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # デプロイ(deploy.yml)と同じ Dockerfile でイメージを作る
      - name: Build the backup image
        run: docker build -t nippo-backup:ci backup
      # 偽のメタデータサーバーと Cloud Storage に保存し、保存したファイルから別のデータベースに復元できること
      - name: Back up and restore
        run: |
          bucket="$RUNNER_TEMP/bucket"
          mkdir -p "$bucket"
          node backup/fake-gcs.mjs "$bucket" &
          curl -sS -o /dev/null --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8099/
          psql() { docker run --rm --network host --entrypoint psql nippo-backup:ci -v ON_ERROR_STOP=1 "$@"; }
          psql "$DB/nippo" -c "CREATE TABLE daily_reports (id int PRIMARY KEY, reflection text)" \
            -c "INSERT INTO daily_reports SELECT i, '所感 ' || i FROM generate_series(1, 1000) AS i"
          run_backup() {
            docker run --rm --network host -e DATABASE_URL="$1" -e BUCKET=ci-bucket \
              -e STORAGE_API=http://localhost:8099 -e METADATA_URL=http://localhost:8099 nippo-backup:ci
          }
          run_backup "$DB/nippo"
          test "$(ls "$bucket" | wc -l)" = "1"
          file="$(ls "$bucket")"
          echo "$file" | grep -Eq '^nippo-[0-9]{8}T[0-9]{6}Z\.dump$'
          # CI/CD 設定手順書 6章の手順と同じオプションで復元する
          psql "$DB/nippo" -c "CREATE DATABASE nippo_restore"
          docker run --rm --network host -v "$bucket:/backup:ro" --entrypoint pg_restore nippo-backup:ci \
            --no-owner --no-acl --exit-on-error --dbname="$DB/nippo_restore" "/backup/$file"
          test "$(psql "$DB/nippo_restore" -tAc "SELECT count(*) || ' ' || max(reflection) FROM daily_reports")" = "1000 所感 999"
          # 書き出しに失敗したら、0 以外で終わり、何も保存しない
          if run_backup "postgres://nippo:wrong@localhost:5432/nippo"; then
            echo "::error::接続に失敗しても成功になった"
            exit 1
          fi
          test "$(ls "$bucket" | wc -l)" = "1"
